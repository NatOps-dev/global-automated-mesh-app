apiVersion: v2
kind: Service
metadata:
  name: postgres-db
  spec:
    ports:
      - port: 5432
    selector:
      app: postgres-db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db

  spec:
  containers:
    - name: postgres
      image: postgres:15
      env: 
       - name: POSTGRES_PASSWORD
         value: "tek2kloud-secret-pass"
      ports:
        - containerPort: 5432