name: "Global Mesh Deployment"

on:
  push:
    branches:
      - main
      - feature/full-stack-api

jobs:
  terraform-ansible:
    name: "Infrastructure & Config"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init & Apply
        id: tf_apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          # This captures the new IP and makes it available to the next steps
          echo "NEW_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: Wait for SSH to be ready
        run: |
          echo "Waiting for instance at ${{ env.NEW_IP }} to boot..."
          sleep 30

      - name: Run Ansible Setup
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # 1. Create the key at the root directory from GitHub Secrets
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./final-key
          chmod 400 ./final-key
          
          # 2. Run Ansible, passing the NEW_IP dynamically 
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --extra-vars "TARGET_IP=${{ env.NEW_IP }}" \
            --private-key ./final-key \
            -u ubuntu
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mesh-api:latest