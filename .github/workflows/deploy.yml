name: "Global Mesh Deployment"

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: "Infrastructure & Config"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init & Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Run Ansible Setup
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # 1. Create the key at the root so the path is simple
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > final-key
          chmod 400 final-key
          
          # 2. Run Ansible from the root, pointing to the inventory inside the folder
          # Use -u ubuntu because your AMI is Ubuntu 24.04
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml --private-key ./final-key -u ubuntu