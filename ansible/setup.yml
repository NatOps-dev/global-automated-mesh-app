---
- name: Configure Global Automated Mesh Worker
  hosts: mesh_nodes
  become: yes
  tasks:
    - name: Update apt cache and upgrade system
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install K3s (Lightweight Kubernetes)
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s to initialize
      pause:
        seconds: 15

    - name: Deploy a test Nginx Pod
      shell: /usr/local/bin/kubectl run nginx-mesh --image=nginx --port=80
      register: deploy_result
      ignore_errors: yes

    - name: Expose Nginx via NodePort
      shell: /usr/local/bin/kubectl expose pod nginx-mesh --type=NodePort --port=80
      ignore_errors: yes
    
    - name: Create k8s directory on server
      file:
        path: /home/ubuntu/k8s
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy Database Manifest to Server
      copy: # Added missing module name
        src: ../k8s/ # Fixed indentation
        dest: /home/ubuntu/k8s/
        mode: '0644'
        owner: ubuntu
        group: ubuntu

    - name: Apply all Kubernetes Manifests
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kunbectl apply -f /home/ubuntu/k8s/ 
        
        
        # Fixed typo in kubectl